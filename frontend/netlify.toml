# Netlify: publish the Next.js static export.
[build]
  command = "npm run build"
  publish = "out"

# Auto-update for new detail pages, with no rebuild and no build hook:
# public list pages and detail components already fetch live data from
# the Vercel API in the browser, so an edit is live on the next page
# load. The only gap was a brand-new /team/<slug> or /projects/<slug>,
# which has no pre-rendered HTML file in out/ and would 404.
# These rewrites (status 200, not a redirect) serve a pre-rendered
# detail file for an unknown slug; the detail component then reads the
# slug from the actual URL and fetches the correct record. Existing
# pre-rendered slugs keep serving their own file first, because a
# rewrite without force=true does not override an existing file.
# A catch-all SPA rewrite is deliberately NOT used: it would mask
# real 404s for other routes.
[[redirects]]
  from = "/team/*"
  to = "/team/sample-ayesha-khan.html"
  status = 200

[[redirects]]
  from = "/projects/*"
  to = "/projects/sample-ai-showreel.html"
  status = 200

# Section 5E security headers. CSP keeps 'unsafe-inline' for scripts and
# styles because Next.js static export + the inline theme script in
# layout.tsx require it; this is the least permissive working config, not
# a blanket allow. connect-src covers the Vercel API, Firebase Auth and
# direct Cloudinary uploads (2026-10-30: uploads failed until
# api.cloudinary.com was added); style-src/font-src cover Google Fonts;
# frame-src/object-src are 'self' only: resumes open in a new tab
# (2026-10-31), so no embed origin is needed any more.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https://aict-portfolio.vercel.app https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'; frame-src 'self'; object-src 'self'; base-uri 'self'"
